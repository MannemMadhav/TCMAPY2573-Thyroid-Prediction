<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - TCMAPY2573</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Login</h1>

        {% if error %}
            <div class="warning">
                {{ error }}
            </div>
            <br>
        {% endif %}

        <form method="POST" action="/login">

            <label for="username">Username:</label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <br><br>

            <label for="password">Password:</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

        <br>

        <a href="/register">
            Create an account
        </a>

        <br><br>

        <a href="/">
            Back to Home
        </a>

    </div>

</div>

</body>

</html>
